<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generátor QR kódů</title>
    <!-- Načtení čisté JS knihovny pro generování QR kódů (bez reklam) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #111;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        input[type="url"], input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="url"]:focus, input[type="text"]:focus {
            border-color: #0066cc;
        }

        button {
            padding: 12px 16px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0052a3;
        }

        #qrcode-wrapper {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        #qrcode img {
            border: 1px solid #eee;
            padding: 12px;
            border-radius: 8px;
            background: #fff;
        }

        .btn-download {
            background-color: #28a745;
            display: none;
        }

        .btn-download:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Generátor QR kódů</h1>
    
    <div class="input-group">
        <input type="text" id="url-input" placeholder="Zadej URL adresu (např. https://example.com)" />
        <button onclick="generateQR()">Vygenerovat QR kód</button>
    </div>

    <div id="qrcode-wrapper">
        <div id="qrcode"></div>
        <button id="download-btn" class="btn-download" onclick="downloadQR()">Stáhnout QR kód</button>
    </div>
</div>

<script>
    let qr;

    function generateQR() {
        const urlInput = document.getElementById('url-input').value.trim();
        const qrContainer = document.getElementById('qrcode');
        const downloadBtn = document.getElementById('download-btn');

        if (!urlInput) {
            alert('Prosím zadej platnou adresu.');
            return;
        }

        // Pročistit předchozí QR kód
        qrContainer.innerHTML = '';

        // Vytvoření nového QR kódu
        qr = new QRCode(qrContainer, {
            text: urlInput,
            width: 200,
            height: 200,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        // Zobrazit tlačítko ke stažení
        downloadBtn.style.display = 'block';
    }

    function downloadQR() {
        const img = document.querySelector('#qrcode img');
        if (!img) return;

        const link = document.createElement('a');
        link.download = 'qr-kod.png';
        link.href = img.src;
        link.click();
    }
</script>

</body>
</html>
